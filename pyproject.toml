[project]
name = "portfolio-watchlist-intelligence"
version = "0.1.0"
description = "Earnings-date tracking and results notification for a personal stock watchlist"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "httpx>=0.28",
    "python-dotenv>=1.2.2",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "lxml>=6.1.1",
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `fakes` is the test-support module in tests/, not a third-party package.
known-first-party = ["pwi", "fakes"]
