name: Results Watch

# Detects published results and mails them. Runs every three hours: the binding constraint
# on latency is not this schedule but how long Yahoo takes to populate an actual EPS after
# a company reports, so polling faster buys nothing. Outside earnings season almost every
# run does no work at all, because only tickers inside their reporting window are queried.
#
# GitHub's scheduled runs are best-effort — they drift by minutes and are occasionally
# skipped under load. At this cadence a missed run is invisible.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be sent, change nothing"
        type: boolean
        default: false

permissions:
  contents: write

# Both jobs write the same encrypted watchlist. Queue rather than cancel: a cancelled run
# could drop a notification that was already sent but not yet recorded.
concurrency:
  group: watchlist-state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A scheduled run is pinned to the commit that was current when it was *queued*, not
      # when it starts. Runs serialised behind the concurrency group can therefore begin
      # against state another run has already advanced, and then find their own state
      # commit unmergeable. Read the current tip instead of the pinned one.
      - name: Take the current state
        run: |
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run
        env:
          PWI_WATCHLIST_KEY: ${{ secrets.PWI_WATCHLIST_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          uv run python -m pwi results-watch \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit state
        # The Run step now exits non-zero when a delivery failed, so the whole job is
        # correctly reported as failed — but the tickers that DID succeed were already
        # saved to disk before that exit, and must still be committed. Without `always()`
        # this step is skipped on that failure, discarding real state and re-sending
        # already-delivered mail on the next run.
        if: always()
        run: |
          if git diff --quiet -- data/watchlist.enc; then
            echo "no state change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.enc
          git commit -m "Results watch: record notified quarters [skip ci]"
          # No rebase here: the watchlist is encrypted, so every byte changes on every
          # write and git can never merge two versions of it. If the push is rejected,
          # something moved the branch during the run — fail, and let the next run redo
          # the work. That resends a mail rather than losing one, which is the direction
          # this system errs in deliberately.
          git push
