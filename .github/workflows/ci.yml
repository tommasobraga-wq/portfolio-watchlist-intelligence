name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # No network and no credentials: every test runs against fakes by design, so a
      # throttled Yahoo or an expired app password can never turn the suite red.
      - run: uv run pytest -q
